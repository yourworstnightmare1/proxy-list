<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
    <script src="sentry-init.js"></script>
    <script src="debug-overlays.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changelog | Proxy list</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #6cb3ff;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem 1.2rem 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      background: #141414;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 0.95rem 1rem;
      margin-top: 1rem;
    }
    .entry-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.75rem;
      align-items: baseline;
      margin-bottom: 0.65rem;
    }
    .entry-version {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }
    .entry-meta {
      color: var(--muted);
      font-size: 0.82rem;
    }
    .entry-body h3 {
      margin: 0.85rem 0 0.35rem;
      font-size: 0.95rem;
    }
    .entry-body h3:first-child { margin-top: 0; }
    .entry-body p, .entry-body ul {
      margin: 0.45rem 0;
      color: var(--text);
      font-size: 0.9rem;
    }
    .entry-body ul { padding-left: 1.2rem; }
    .entry-body li { margin: 0.3rem 0; }
    a { color: var(--accent); }
    .err {
      border: 1px solid #6b2d2d;
      color: #ff9b9b;
      background: #141414;
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Update changelog</h1>
    <p class="sub">Archive of previous site update messages shown in the Update Notice.</p>
  </header>
  <main>
    <a class="btn" href="./">← Back to proxy list</a>
    <div id="changelogRoot"><p class="sub" style="margin-top:1rem;">Loading changelog…</p></div>
  </main>
  <script src="datetime.js?v=tz-12h"></script>
  <script>
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdownInline(text) {
      var s = escapeHtml(String(text || ""));
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
        var h = String(href || "").trim();
        if (!/^https?:\/\//i.test(h)) return label;
        return '<a href="' + escapeHtml(h) + '" rel="noopener noreferrer" target="_blank">' + label + "</a>";
      });
      return s;
    }

    function renderNoticeMarkdown(md) {
      var text = String(md || "").replace(/\r\n/g, "\n").trim();
      if (!text) return '<p class="sub">No update message recorded.</p>';
      var chunks = [];
      var sections = text.split(/(?=^#{1,3} )/m);
      sections.forEach(function (sec) {
        var s = sec.trim();
        if (!s) return;
        var hm = s.match(/^(#{1,3})\s+(.+?)(?:\n|$)([\s\S]*)$/);
        if (hm) {
          var level = hm[1].length;
          var title = hm[2].trim();
          var body = (hm[3] || "").trim();
          var tag = level <= 2 ? "h3" : "h3";
          chunks.push("<" + tag + ">" + renderMarkdownInline(title) + "</" + tag + ">");
          if (body) {
            body.split(/\n{2,}/).forEach(function (para) {
              var lines = para.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
              if (!lines.length) return;
              if (lines.every(function (l) { return /^[-*]\s/.test(l); })) {
                chunks.push(
                  "<ul>" +
                    lines
                      .map(function (line) {
                        return "<li>" + renderMarkdownInline(line.replace(/^[-*]\s+/, "")) + "</li>";
                      })
                      .join("") +
                    "</ul>"
                );
              } else {
                chunks.push(
                  "<p>" +
                    lines.map(function (line) { return renderMarkdownInline(line); }).join("<br>") +
                    "</p>"
                );
              }
            });
          }
        } else if (/^[-*]\s/m.test(s)) {
          chunks.push(
            "<ul>" +
              s
                .split(/\n/)
                .filter(function (line) { return /^[-*]\s/.test(line.trim()); })
                .map(function (line) {
                  return "<li>" + renderMarkdownInline(line.trim().replace(/^[-*]\s+/, "")) + "</li>";
                })
                .join("") +
              "</ul>"
          );
        } else {
          s.split(/\n{2,}/).forEach(function (para) {
            var lines = para.split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
            if (!lines.length) return;
            chunks.push(
              "<p>" + lines.map(function (line) { return renderMarkdownInline(line); }).join("<br>") + "</p>"
            );
          });
        }
      });
      return chunks.join("");
    }

    function renderEntry(entry) {
      var version = escapeHtml(entry.version || "Unknown");
      var revision = entry.revision ? " " + escapeHtml(entry.revision) : "";
      var released = "";
      if (entry.released) {
        try {
          if (window.ProxyListDateTime && typeof window.ProxyListDateTime.formatLoose === "function") {
            released = escapeHtml(window.ProxyListDateTime.formatLoose(entry.released, { dateOnly: true }) || entry.released);
          } else {
            released = escapeHtml(entry.released);
          }
        } catch (_) {
          released = escapeHtml(entry.released);
        }
      }
      return (
        '<article class="entry">' +
        '<div class="entry-head">' +
        '<h2 class="entry-version">' + version + revision + "</h2>" +
        (released ? '<span class="entry-meta">Released ' + released + "</span>" : "") +
        "</div>" +
        '<div class="entry-body">' +
        renderNoticeMarkdown(entry.update_notice) +
        "</div></article>"
      );
    }

    fetch("update_changelog.json")
      .then(function (r) {
        if (!r.ok) throw new Error("Could not load changelog (" + r.status + ")");
        return r.json();
      })
      .then(function (payload) {
        var entries = payload && payload.entries;
        var root = document.getElementById("changelogRoot");
        if (!Array.isArray(entries) || !entries.length) {
          root.innerHTML = '<p class="sub">No archived update notices yet.</p>';
          return;
        }
        root.innerHTML = entries.map(renderEntry).join("");
      })
      .catch(function (err) {
        document.getElementById("changelogRoot").innerHTML =
          '<div class="err">' + escapeHtml(err && err.message ? err.message : String(err)) + "</div>";
      });
  </script>
</body>
</html>
