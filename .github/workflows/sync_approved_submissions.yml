name: Sync approved submissions

# Pull approved Firestore link submissions into list.md and refresh site data.
# Requires repo secret FIREBASE_SERVICE_ACCOUNT (full service-account JSON).
# Optional: Worker POST /api/submissions/sync with GITHUB_PUBLISH_TOKEN dispatches this workflow.

on:
  schedule:
    # Daily: Spark/free Firestore quotas trip hard with frequent polls
    # alongside Worker click/presence traffic (HTTP 429 RESOURCE_EXHAUSTED).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install crypto helper
        run: pip install cryptography

      - name: Sync approved submissions
        id: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set; skipping sync."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/sync_approved_submissions.py --mark-published
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.sync.outputs.skipped != 'true'
        run: |
          git config user.name "auto-link-bot"
          git config user.email "bot@users.noreply.github.com"
          git add list.md docs/data.json docs/data.json.gz docs/unsorted.json docs/contributor_link_totals.json docs/submission_url_keys.json docs/update_changelog.json docs/archived_providers.json || true
          if git diff --cached --quiet; then
            echo "No list changes to commit"
            exit 0
          fi
          git commit -m "Auto-publish approved link submissions"

          resolve_rebase_conflicts() {
            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [ -z "$conflicts" ]; then
              return 1
            fi
            echo "Resolving rebase conflicts by regenerating export files…"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/data.json|docs/data.json.gz|docs/unsorted.json|docs/contributor_link_totals.json|docs/submission_url_keys.json|docs/update_changelog.json|docs/archived_providers.json|docs/filter_stats.json)
                  # Prefer upstream during rebase, then regenerate from list.md.
                  git checkout --ours -- "$f" 2>/dev/null || true
                  git add -- "$f"
                  ;;
                list.md)
                  # Keep our publish commit's list changes when possible.
                  git checkout --theirs -- "$f" 2>/dev/null || true
                  git add -- "$f"
                  ;;
                *)
                  git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
                  git add -- "$f"
                  ;;
              esac
            done <<< "$conflicts"
            python scripts/convert_list_to_json.py
            git add list.md docs/data.json docs/data.json.gz docs/unsorted.json docs/contributor_link_totals.json docs/submission_url_keys.json docs/update_changelog.json docs/archived_providers.json || true
            GIT_EDITOR=true git rebase --continue
          }

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing…"
            if ! git pull --rebase --autostash origin main; then
              resolve_rebase_conflicts || exit 1
            fi
            sleep $((attempt * 2))
          done
          exit 1