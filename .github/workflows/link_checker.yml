name: Auto Update Proxy Links

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Bump revision and Last Updated (user-facing Sunday release)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "list.md"
      - "unsorted.md"
      - "unsorted_raw.txt"
      - "scripts/link_checker.py"
      - "scripts/convert_list_to_json.py"
      - "scripts/update_link_check_meta.py"
      - "scripts/update_unsorted_from_raw.py"
      - "scripts/release_schedule.py"
      - "scripts/build_filter_stats.py"

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug commit
        run: |
          echo "Commit: $GITHUB_SHA"

      - name: Debug script
        run: |
          head -n 20 scripts/link_checker.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run link checker
        env:
          LINK_CHECK_NO_PURGE: ${{ vars.LINK_CHECK_NO_PURGE || 'false' }}
          LINK_CHECK_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'true' || '' }}
        run: |
          echo "Running script..."
          set +e
          python scripts/link_checker.py
          EXIT_CODE=$?
          echo "Script exit code: $EXIT_CODE"
          set -e

      - name: Rebuild unsorted list
        run: |
          python scripts/update_unsorted_from_raw.py

      - name: Export web data
        run: |
          python scripts/update_link_check_meta.py
          python scripts/convert_list_to_json.py
          python scripts/build_filter_stats.py

      - name: Debug commit_info
        run: |
          if test -f commit_info.json; then
            echo "commit_info.json:"; cat commit_info.json
          fi
          if test -f commit_info.txt; then
            echo "commit_info.txt:"; cat commit_info.txt
          fi

      # Prefer JSON from link_checker (no pipe/awk ambiguity). Fallback to legacy .txt
      - name: Read commit info
        id: commitinfo
        shell: bash
        run: |
          python3 << 'PY'
          import json
          import os
          from pathlib import Path

          defaults_version, defaults_revision = "v0.0.0", "r0"
          defaults_removed, defaults_total = "0", "0"
          defaults_release = "false"

          version = revision = None
          removed_str = total_str = None
          release_published = None

          jp = Path("commit_info.json")
          if jp.is_file():
              meta = json.loads(jp.read_text(encoding="utf-8"))
              version = meta.get("version")
              revision = meta.get("revision")
              r, t = meta.get("removed"), meta.get("total")
              if r is not None:
                  removed_str = str(r)
              if t is not None:
                  total_str = str(t)
              if "release_published" in meta:
                  release_published = bool(meta["release_published"])
              print("commit_info.json:", version, revision, removed_str, total_str, release_published)

          if version is None:
              tp = Path("commit_info.txt")
              if tp.is_file():
                  raw = tp.read_text(encoding="utf-8").strip().replace("\r\n", "\n").replace("\r", "\n")
                  parts = [x.strip() for x in raw.split("|")]
                  if len(parts) >= 4:
                      version, revision = parts[0], parts[1]
                      removed_str, total_str = parts[2], parts[3]

          version = version or defaults_version
          revision = revision or defaults_revision
          removed_str = removed_str if removed_str is not None else defaults_removed
          total_str = total_str if total_str is not None else defaults_total
          release_flag = (
              "true"
              if release_published is True
              else ("false" if release_published is False else defaults_release)
          )

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"revision={revision}\n")
              f.write(f"removed={removed_str}\n")
              f.write(f"total={total_str}\n")
              f.write(f"release_published={release_flag}\n")
          PY

      - name: Commit changes
        run: |
          git config --global user.name "auto-link-bot"
          git config --global user.email "bot@users.noreply.github.com"

          git add *.md docs/data.json docs/data.json.gz docs/unsorted.json docs/contributor_link_totals.json docs/filter_stats.json docs/link_check_meta.json docs/link_check_snapshot.json link_status.json docs/submission_url_keys.json docs/archived_providers.json || true

          if ! git diff --cached --quiet; then
            if [ "${{ steps.commitinfo.outputs.release_published }}" = "true" ]; then
              git commit -m "${{ steps.commitinfo.outputs.version }} ${{ steps.commitinfo.outputs.revision }} | purged ${{ steps.commitinfo.outputs.removed }} dead links, link count: ${{ steps.commitinfo.outputs.total }}"
            else
              git commit -m "Silent maintenance | link check (purged ${{ steps.commitinfo.outputs.removed }} dead links, link count: ${{ steps.commitinfo.outputs.total }})"
            fi

            resolve_rebase_conflicts() {
              local conflicts
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              if [ -z "$conflicts" ]; then
                return 1
              fi
              echo "Resolving rebase conflicts by regenerating export files…"
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  docs/filter_stats.json|docs/data.json|docs/data.json.gz|docs/unsorted.json|docs/contributor_link_totals.json|docs/link_check_meta.json|docs/link_check_snapshot.json|link_status.json|docs/submission_url_keys.json|docs/archived_providers.json)
                    # During rebase, --ours is upstream (origin/main).
                    git checkout --ours -- "$f" 2>/dev/null || true
                    git add -- "$f"
                    ;;
                  list.md|unsorted.md|unsorted_raw.txt)
                    # Keep this run's link-check edits.
                    git checkout --theirs -- "$f" 2>/dev/null || true
                    git add -- "$f"
                    ;;
                  *)
                    git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
                    git add -- "$f"
                    ;;
                esac
              done <<< "$conflicts"
              python scripts/update_link_check_meta.py || true
              python scripts/convert_list_to_json.py
              python scripts/build_filter_stats.py
              git add *.md docs/data.json docs/data.json.gz docs/unsorted.json docs/contributor_link_totals.json docs/filter_stats.json docs/link_check_meta.json docs/link_check_snapshot.json link_status.json docs/submission_url_keys.json docs/archived_providers.json || true
              GIT_EDITOR=true git rebase --continue
            }

            # Concurrent main pushes (export / manual commits) often race this step.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push rejected (attempt ${attempt}); rebasing onto origin/main…"
              if ! git pull --rebase --autostash origin main; then
                resolve_rebase_conflicts || exit 1
              fi
              sleep $((attempt * 2))
            done
            echo "Failed to push after retries"
            exit 1
          else
            echo "No changes to commit"
          fi